<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Online Classifieds Search Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 30px;
        }

        .form-container {
            width: 580px;
            margin: 0 auto;
            background-color: #d8fbfd;
            border: 2px solid #0055d4;
            padding: 20px 25px;
            box-sizing: border-box;
        }

        h2.title {
            color: red;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px;
            margin: 0 0 10px 0;
            font-weight: bold;
        }

        hr {
            border: none;
            border-top: 1px solid #7ea6a6;
            margin-bottom: 15px;
        }

        .section-title {
            font-weight: bold;
            font-size: 14px;
            margin-top: 12px;
            margin-bottom: 8px;
            color: #000;
        }

        table {
            border-collapse: collapse;
            font-size: 13px;
        }

        td {
            padding: 2px 4px;
            vertical-align: middle;
        }

        input[type="text"] {
            border: 1px solid #7f9db9;
            padding: 3px 5px;
            font-size: 13px;
            box-sizing: border-box;
            background-color: white;
        }

        .button-group {
            display: flex;
            align-items: flex-start;
            gap: 25px;
            margin-top: 10px;
        }

        .btn-item {
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }

        .btn-item img {
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h2 class="title">Online Classifieds Search Form</h2>

    <hr>

    <form id="classifiedForm">

        <!-- 1 -->
        <div class="section-title">
            1) Search for a classified in the following sections:
        </div>

        <table style="width: 60%; margin-left: 10px;">
            <tr>
                <td>
                    <label>
                        <input type="radio" name="section" value="Employment">
                        Employment
                    </label>
                </td>

                <td>
                    <label>
                        <input type="radio" name="section" value="Personal">
                        Personal
                    </label>
                </td>
            </tr>

            <tr>
                <td>
                    <label>
                        <input type="radio" name="section" value="For Sale" checked>
                        For Sale
                    </label>
                </td>

                <td>
                    <label>
                        <input type="radio" name="section" value="Miscellaneous">
                        Miscellaneous
                    </label>
                </td>
            </tr>

            <tr>
                <td>
                    <label>
                        <input type="radio" name="section" value="Housing">
                        Housing
                    </label>
                </td>

                <td>
                    <label>
                        <input type="radio" name="section" value="All of the above">
                        All of the above
                    </label>
                </td>
            </tr>
        </table>


        <!-- 2 -->
        <div class="section-title">
            2) Search the following publications:
        </div>

        <table style="width: 100%; margin-left: 10px;">

            <tr>
                <td style="width: 38%;">
                    <label>
                        <input type="checkbox" name="pub"
                               value="Midwest times" checked>
                        Midwest times
                    </label>
                </td>

                <td style="width: 30%;">
                    <label>
                        <input type="checkbox" name="pub"
                               value="Modern News">
                        Modern News
                    </label>
                </td>

                <td>
                    <label>
                        <input type="checkbox" name="pub"
                               value="Employment Today">
                        Employment Today
                    </label>
                </td>
            </tr>

            <tr>
                <td>
                    <label>
                        <input type="checkbox" name="pub"
                               value="Great Lakes Classifieds" checked>
                        Great Lakes Classifieds
                    </label>
                </td>

                <td>
                    <label>
                        <input type="checkbox" name="pub"
                               value="Middleton Daily">
                        Middleton Daily
                    </label>
                </td>

                <td>
                    <label>
                        <input type="checkbox" name="pub"
                               value="Cashtown Daily News">
                        Cashtown Daily News
                    </label>
                </td>
            </tr>

        </table>


        <!-- 3 -->
        <div class="section-title" style="margin-top: 15px;">
            3) From to

            <input
                type="text"
                name="fromDate"
                placeholder="mm/dd/yy"
                style="width: 130px;"
            >

            to

            <input
                type="text"
                name="toDate"
                placeholder="mm/dd/yy"
                style="width: 130px;"
            >.
        </div>


        <!-- 4 -->
        <div class="section-title" style="margin-top: 15px;">
            4) Enter a few keywords to describe the classified.
        </div>

        <div style="margin-top: 5px;">
            <input
                type="text"
                id="keywords"
                name="keywords"
                style="width: 100%;"
            >
        </div>


        <!-- 5 -->
        <div class="section-title" style="margin-top: 15px;">
            5) Click one of the options below:
        </div>

        <div class="button-group">

            <button
                type="button"
                class="btn-item"
                onclick="handleSearch()"
            >
                <img src="Search.gif" alt="Search">
            </button>


            <button
                type="button"
                class="btn-item"
                onclick="handleHelp()"
            >
                <img src="Help.gif" alt="Help">
            </button>


            <button
                type="button"
                class="btn-item"
                onclick="handleCancel()"
            >
                <img src="Cancel.gif" alt="Cancel">
            </button>

        </div>

    </form>

</div>


<script>

    // =========================
    // SEARCH
    // =========================
    function handleSearch() {

        var kw = document.getElementById("keywords").value.trim();

        if (kw === "") {

            alert(
                "Đang tìm kiếm tất cả các mục phân loại phù hợp..."
            );

        } else {

            alert(
                'Đang tìm kiếm với từ khóa: "' + kw + '"'
            );

        }
    }


    // =========================
    // HELP
    // =========================
    function handleHelp() {

        var helpWindow = window.open(
            "",
            "HelpWindow",
            "width=420,height=300"
        );

        if (!helpWindow) {
            alert("Trình duyệt đang chặn cửa sổ popup!");
            return;
        }

        helpWindow.document.title = "Trợ giúp tìm kiếm";

        helpWindow.document.body.innerHTML = `
            <div style="
                font-family: Arial;
                padding: 20px;
                line-height: 1.6;
            ">

                <h3 style="
                    color: #0055d4;
                    margin-top: 0;
                ">
                    Hướng dẫn tìm kiếm
                </h3>

                <p>
                    • <b>Bước 1:</b>
                    Chọn phân mục cần tìm.
                </p>

                <p>
                    • <b>Bước 2:</b>
                    Tích chọn các báo xuất bản.
                </p>

                <p>
                    • <b>Bước 3:</b>
                    Nhập ngày bắt đầu và kết thúc.
                </p>

                <p>
                    • <b>Bước 4:</b>
                    Nhập từ khóa mô tả và bấm
                    <b>Search</b>.
                </p>

            </div>
        `;
    }


    // =========================
    // CANCEL
    // =========================
    function handleCancel() {

        var form = document.getElementById("classifiedForm");

        var inputs = form.querySelectorAll("input");

        inputs.forEach(function(input) {

            if (input.type === "text") {

                input.value = "";

            } else if (
                input.type === "radio" ||
                input.type === "checkbox"
            ) {

                input.checked = false;

            }

        });
    }

</script>

</body>
</html>
